# Shared by every environment. Environment-specific values live in application-<profile>.yaml:
# local (default, your machine) and dev (a deployed server, values from environment variables).
spring:
  application:
    name: opicer-api
  profiles:
    default: local
  datasource:
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

opicer:
  auth:
    jwt-ttl-seconds: ${JWT_TTL_SECONDS:3600}
    cookie-name: OPICER_AUTH
    admin-allowlist: ${ADMIN_EMAIL_ALLOWLIST:}
  ai:
    openai-embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    openai-embedding-dimension: ${OPENAI_EMBEDDING_DIMENSION:1536}
    stt:
      openai-model: ${OPICER_STT_OPENAI_MODEL:whisper-1}
    evaluation:
      # Answer evaluation (structured output). Provider is swappable; openai uses OPENAI_API_KEY.
      provider: ${OPICER_EVAL_PROVIDER:openai}
      openai-model: ${OPICER_EVAL_MODEL:gpt-5.6-sol}
      reasoning-effort: ${OPICER_EVAL_REASONING_EFFORT:medium}
      max-output-tokens: ${OPICER_EVAL_MAX_OUTPUT_TOKENS:16000}
      timeout-seconds: ${OPICER_EVAL_TIMEOUT_SECONDS:90}
    worker:
      # Background evaluation worker (ai_job).
      enabled: ${OPICER_AI_WORKER_ENABLED:true}
      poll-interval-ms: ${OPICER_AI_WORKER_POLL_MS:2000}
      concurrency: ${OPICER_AI_WORKER_CONCURRENCY:3}
      max-attempts: 3
      max-manual-retries: 2
  rag:
    # docs/adr/0001-vector-similarity.md
    candidates: ${OPICER_RAG_CANDIDATES:12}
    top-k: ${OPICER_RAG_TOP_K:3}
    min-similarity: ${OPICER_RAG_MIN_SIMILARITY:0.25}
    mmr-lambda: ${OPICER_RAG_MMR_LAMBDA:0.7}
    min-query-words: ${OPICER_RAG_MIN_QUERY_WORDS:15}
  storage:
    good-answer-dir: ${OPICER_GOOD_ANSWER_DIR:./storage/good-answers}
    good-answer-url-prefix: ${OPICER_GOOD_ANSWER_URL_PREFIX:/media/good-answers}
  # NAVER Cloud Platform Maps, for geocoding admin-entered test center addresses (optional).
  naver-map:
    client-id: ${NAVER_MAP_CLIENT_ID:}
  credit:
    unsafe-delay-ms: ${OPICER_CREDIT_UNSAFE_DELAY_MS:0}
    idempotency-ttl-hours: ${OPICER_CREDIT_IDEMPOTENCY_TTL_HOURS:24}
