spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/opicer
    driver-class-name: org.postgresql.Driver
    username: ${OPICER_DB_USER:opicer}
    password: ${OPICER_DB_PASSWORD:opicer}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
opicer:
  ai:
    stt:
      # Production uses real speech recognition; a missing key fails loudly (AI_NOT_CONFIGURED)
      # instead of silently serving canned transcripts. Local (default profile) keeps the mock.
      provider: ${OPICER_STT_PROVIDER:openai}
